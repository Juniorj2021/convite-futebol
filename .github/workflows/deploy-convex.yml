name: Deploy Convex backend

on:
  push:
    branches: [main]
    paths:
      - "convex/**"
      - "package.json"
      - ".github/workflows/deploy-convex.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Create temporary production deploy key and deploy
        env:
          CONVEX_PERSONAL_ACCESS_TOKEN: ${{ secrets.CONVEX_PERSONAL_ACCESS_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$CONVEX_PERSONAL_ACCESS_TOKEN" ]; then
            echo "Personal access token is missing."
            exit 1
          fi

          EXPIRES_AT=$(( $(date +%s) * 1000 + 7200000 ))

          RESPONSE=$(curl --fail --silent --show-error \
            -X POST \
            "https://api.convex.dev/v1/deployments/reminiscent-oyster-516/create_deploy_key" \
            -H "Authorization: Bearer $CONVEX_PERSONAL_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"name\":\"github-actions-${GITHUB_RUN_ID}\",\"allowedActions\":[\"deployment:deploy\",\"deployment:env:write\"],\"expiresAt\":$EXPIRES_AT}")

          CONVEX_DEPLOY_KEY=$(printf '%s' "$RESPONSE" | jq -er '.deployKey')

          echo "::add-mask::$CONVEX_DEPLOY_KEY"
          export CONVEX_DEPLOY_KEY

          echo "Temporary production key created successfully."

          if [ -z "$VAPID_PRIVATE_KEY" ]; then
            echo "VAPID_PRIVATE_KEY is missing."
            exit 1
          fi

          npx convex env set --prod VAPID_PUBLIC_KEY "BJoCs45XKiJk9UpIMQl0TYloUh-own_uOdR9VaMGc6672N2ruiv6zpYZhZRQHJ3ejF3pJlPGadJnSwyGxoAW8I4"
          npx convex env set --prod VAPID_PRIVATE_KEY "$VAPID_PRIVATE_KEY"

          npx convex deploy

          echo "Production deployment completed."
