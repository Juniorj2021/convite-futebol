name: Deploy Convex backend
on:
  push:
    branches: [main]
    paths:
      - "convex/**"
      - "package.json"
      - ".github/workflows/deploy-convex.yml"
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Configure protected Web Push keys when the secret is available
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          if [ -n "$VAPID_PRIVATE_KEY" ]; then
            npx convex env set --prod VAPID_PUBLIC_KEY "BJoCs45XKiJk9UpIMQl0TYloUh-own_uOdR9VaMGc6672N2ruiv2zpYZhZRQHJ3ejF3pJlPGadJnSwyGxoAW8I4"
            npx convex env set --prod VAPID_PRIVATE_KEY "$VAPID_PRIVATE_KEY"
          else
            echo "Web Push private key not configured yet; backend will deploy, but notifications remain inactive."
          fi
      - name: Deploy to the linked Convex deployment
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy
